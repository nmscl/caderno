  # -------------------------------------------------------------------
  - title: Clima
    path: clima
    icon: mdi:thermostat
    type: sections
    max_columns: 2
    sections:

      - type: grid
        cards:
          - type: custom:button-card
            template: clima
            entity: climate.ac_sala
            name: Sala
            grid_options: { columns: 12, rows: auto }
          - type: thermostat
            entity: climate.ac_sala
            show_current_as_primary: true
            features:
              - type: climate-hvac-modes
                style: icons
                hvac_modes: ["off", cool, heat, dry, fan_only, auto]
              - type: climate-fan-modes
                style: dropdown
          - type: custom:mini-graph-card
            name: Temperatura sala · 24 h
            icon: mdi:thermometer
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            animate: true
            show: { fill: fade, extrema: true, labels: false }
            entities:
              - entity: climate.ac_sala
                attribute: current_temperature
                name: Atual
                color: "#00e5ff"
              - entity: climate.ac_sala
                attribute: temperature
                name: Alvo
                color: "#ff4081"
                show_fill: false
                smoothing: false

      - type: grid
        cards:
          - type: custom:button-card
            template: clima
            entity: climate.ac_quarto
            name: Quarto
            grid_options: { columns: 12, rows: auto }
          - type: thermostat
            entity: climate.ac_quarto
            show_current_as_primary: true
            features:
              - type: climate-hvac-modes
                style: icons
                hvac_modes: ["off", cool, heat, dry, fan_only, auto]
              - type: climate-fan-modes
                style: dropdown
          - type: custom:mini-graph-card
            name: Temperatura quarto · 24 h
            icon: mdi:thermometer
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            animate: true
            show: { fill: fade, extrema: true, labels: false }
            entities:
              - entity: climate.ac_quarto
                attribute: current_temperature
                name: Atual
                color: "#00e5ff"
              - entity: climate.ac_quarto
                attribute: temperature
                name: Alvo
                color: "#ff4081"
                show_fill: false
                smoothing: false

  # -------------------------------------------------------------------
  - title: Energia
    path: energia
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:

      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: kpi
            entity: sensor.casa_consumo_total
            name: Agora
            icon: mdi:flash
            variables: { cor1: "#00e5ff", cor2: "#7c4dff" }
            grid_options: { columns: 4, rows: auto }
          - type: custom:button-card
            template: kpi
            entity: sensor.casa_energia_hoje
            name: Hoje
            icon: mdi:lightning-bolt-circle
            variables: { cor1: "#b388ff", cor2: "#ff4081", casas: 2 }
            grid_options: { columns: 4, rows: auto }
          - type: custom:button-card
            template: kpi
            entity: sensor.casa_custo_hoje
            name: Custo hoje
            icon: mdi:cash
            variables: { cor1: "#69f0ae", cor2: "#00e5ff", casas: 2 }
            grid_options: { columns: 4, rows: auto }

      - type: grid
        cards:
          - type: gauge
            entity: sensor.casa_consumo_total
            name: Potência instantânea
            min: 0
            max: 6900          # <-- potência contratada (W)
            needle: true
            segments:
              - { from: 0, color: "#00e5ff" }
              - { from: 2000, color: "#7c4dff" }
              - { from: 4000, color: "#ff9100" }
              - { from: 5500, color: "#ff1744" }
            grid_options: { columns: 12, rows: auto }
          - type: entities
            entities:
              - entity: input_number.casa_preco_kwh

      - type: grid
        column_span: 2
        cards:
          - type: custom:mini-graph-card
            name: Consumo da casa · 24 h
            icon: mdi:home-lightning-bolt
            hours_to_show: 24
            points_per_hour: 6
            line_width: 3
            height: 180
            animate: true
            show: { fill: fade, extrema: true, average: true, labels: false }
            entities:
              - entity: sensor.casa_consumo_total
            color_thresholds:
              - { value: 0, color: "#00e5ff" }
              - { value: 1000, color: "#7c4dff" }
              - { value: 2500, color: "#ff9100" }
              - { value: 4000, color: "#ff1744" }
          - type: custom:mini-graph-card
            name: Por equipamento · 12 h
            icon: mdi:chart-line
            hours_to_show: 12
            points_per_hour: 6
            line_width: 2
            animate: true
            show: { fill: false, legend: true, labels: false }
            entities:
              - entity: sensor.shelly_maquina_lavar_power
                name: Máquina
                color: "#00e5ff"
              - entity: sensor.shelly_termoacumulador_power
                name: Termo
                color: "#ff4081"

  # -------------------------------------------------------------------
  - title: Rede
    path: rede
    icon: mdi:wifi
    type: sections
    max_columns: 2
    sections:

      - type: grid
        column_span: 2
        cards:
          - type: custom:button-card
            template: rede
            entity: binary_sensor.ruijie_ap
            grid_options: { columns: full, rows: auto }

      - type: grid
        column_span: 2
        cards:
          - type: custom:mini-graph-card
            name: Tráfego do AP · 6 h
            icon: mdi:swap-vertical
            hours_to_show: 6
            points_per_hour: 30
            line_width: 2
            height: 170
            animate: true
            show: { fill: fade, legend: true, labels: false }
            entities:
              - entity: sensor.ruijie_ap_download
                name: Download
                color: "#00e5ff"
              - entity: sensor.ruijie_ap_upload
                name: Upload
                color: "#ff4081"
          - type: custom:mini-graph-card
            name: Dispositivos ligados · 24 h
            icon: mdi:devices
            hours_to_show: 24
            points_per_hour: 2
            line_width: 3
            animate: true
            show: { graph: bar, labels: false }
            entities:
              - entity: sensor.ruijie_ap_clientes
                color: "#7c4dff"
